<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>いよわ曲データベース</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <header>
    <h1>いよわ曲データベース</h1>
  </header>

  <main>

    <section class="search">
      <input
        type="text"
        id="searchInput"
        placeholder="曲名・読み方・検索条件など"
      >
      <button id="searchButton">検索</button>
    </section>

    <section class="filters">

      <details>
        <summary>アルバム</summary>
        <div id="albumFilters"></div>
      </details>

      <details>
        <summary>カテゴリ</summary>
        <div id="categoryFilters"></div>
      </details>

      <details>
        <summary>ボーカル</summary>
        <div id="vocalFilters"></div>
      </details>

      <details>
        <summary>いよわガールズ</summary>
        <div id="girlFilters"></div>
      </details>

      <details>
        <summary>BPM</summary>

        <div class="number-filter">
          <select id="tempoOperator">
            <option value="eq">ちょうど</option>
            <option value="gte">以上</option>
            <option value="lte">以下</option>
          </select>

          <input
            type="number"
            id="tempoValue"
            placeholder="BPM"
          >
        </div>
      </details>

      <details>
        <summary>再生時間</summary>

        <div class="number-filter">
          <select id="durationOperator">
            <option value="eq">ちょうど</option>
            <option value="gte">以上</option>
            <option value="lte">以下</option>
          </select>

          <input
            type="number"
            id="durationValue"
            placeholder="秒"
          >
        </div>
      </details>

      <details>
        <summary>公開日</summary>

        <div class="number-filter">
          <select id="dateOperator">
            <option value="eq">ちょうど</option>
            <option value="lte">以前</option>
            <option value="gte">以降</option>
          </select>

          <input
            type="date"
            id="dateValue"
          >
        </div>
      </details>

      <details>
        <summary>キー</summary>
        <div id="keyFilters"></div>
      </details>

      <details>
        <summary>拍子</summary>
        <div id="timeSignatureFilters"></div>
      </details>

    </section>

    <section class="results">
      <div class="results-header">
        <p id="resultCount"></p>
      </div>

      <div id="results"></div>
    </section>

  </main>

  <script src="./js/index.js"></script>

</body>
</html>
