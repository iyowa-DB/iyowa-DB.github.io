<script>

/* =========================
   データ
========================= */

let musicData = [];

let currentSearch = "";


/* =========================
   初期化
========================= */

async function init() {

  try {

    const response =
      await fetch("./data/music.json");

    if (!response.ok) {
      throw new Error(
        "music.jsonを読み込めませんでした。"
      );
    }

    musicData =
      await response.json();

    buildFilters();

    applySearch();

  } catch (error) {

    document.getElementById("results")
      .innerHTML = `
        <div class="empty">
          ${escapeHTML(error.message)}
        </div>
      `;

  }
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   配列化
========================= */

function arrayValue(value) {

  return Array.isArray(value)
    ? value
    : [];

}


/* =========================
   名前 + ID
========================= */

function namedIDs(items) {

  return arrayValue(items)
    .map(item =>
      typeof item === "object"
        ? item.id
        : item
    );

}


function namedNames(items) {

  return arrayValue(items)
    .map(item =>
      typeof item === "object"
        ? item.name
        : item
    );

}


/* =========================
   フィルター項目生成
========================= */

function buildFilters() {

  buildNamedFilter(
    "albumOptions",
    "albums",
    "アルバム未収録"
  );

  buildSimpleFilter(
    "categoryOptions",
    "categories"
  );

  buildSimpleFilter(
    "vocalOptions",
    "vocals"
  );

  buildNamedFilter(
    "girlOptions",
    "girls"
  );

  buildSimpleFilter(
    "keyOptions",
    "key"
  );

  buildSimpleFilter(
    "timeSignatureOptions",
    "timeSignature"
  );

}


/* =========================
   単純配列フィルター
========================= */

function buildSimpleFilter(
  containerId,
  property
) {

  const container =
    document.getElementById(containerId);

  const values =
    new Set();

  musicData.forEach(music => {

    arrayValue(music[property])
      .forEach(value => {
        if (value !== "") {
          values.add(value);
        }
      });

  });

  const sorted =
    [...values].sort(
      (a, b) =>
        String(a).localeCompare(
          String(b),
          "ja"
        )
    );

  sorted.forEach(value => {

    container.appendChild(
      createOption(
        property,
        value,
        value
      )
    );

  });

}


/* =========================
   名前 + ID フィルター
========================= */

function buildNamedFilter(
  containerId,
  property,
  extraName = null
) {

  const container =
    document.getElementById(containerId);

  const values =
    new Map();

  musicData.forEach(music => {

    arrayValue(music[property])
      .forEach(item => {

        if (
          item &&
          typeof item === "object"
        ) {

          values.set(
            item.id,
            item.name
          );

        }

      });

  });

  const sorted =
    [...values.entries()]
      .sort((a, b) =>
        a[1].localeCompare(
          b[1],
          "ja"
        )
      );

  sorted.forEach(
    ([id, name]) => {

      container.appendChild(
        createOption(
          property,
          id,
          name
        )
      );

    }
  );


  if (extraName) {

    container.appendChild(
      createOption(
        property,
        "__none__",
        extraName
      )
    );

  }

}


/* =========================
   選択肢
========================= */

function createOption(
  property,
  value,
  label
) {

  const labelElement =
    document.createElement("label");

  labelElement.className =
    "filter-option";

  const input =
    document.createElement("input");

  input.type = "checkbox";
  input.dataset.property = property;
  input.value = value;

  input.addEventListener(
    "change",
    applySearch
  );

  const text =
    document.createElement("span");

  text.textContent = label;

  const count =
    document.createElement("span");

  count.className = "count";
  count.textContent = "(0)";

  count.dataset.countFor =
    property + ":" + value;

  labelElement.appendChild(input);
  labelElement.appendChild(text);
  labelElement.appendChild(count);

  return labelElement;
}


/* =========================
   現在の選択取得
========================= */

function getSelected(property) {

  return [
    ...document.querySelectorAll(
      `input[data-property="${property}"]:checked`
    )
  ].map(input => input.value);

}


/* =========================
   数値条件
========================= */

function compareValue(
  actual,
  operator,
  target
) {

  if (actual === null ||
      actual === undefined) {
    return false;
  }

  if (operator === "eq") {
    return actual === target;
  }

  if (operator === "lte") {
    return actual <= target;
  }

  if (operator === "gte") {
    return actual >= target;
  }

  return true;
}


/* =========================
   曲の条件判定
========================= */

function matchesFilters(
  music,
  ignoreProperty = null
) {

  /* アルバム */

  if (ignoreProperty !== "albums") {

    const selected =
      getSelected("albums");

    if (selected.length > 0) {

      const ids =
        namedIDs(music.albums);

      const hasNone =
        selected.includes("__none__");

      const hasAlbum =
        selected.some(id =>
          ids.includes(id)
        );

      const isNone =
        ids.length === 0;

      if (
        !(hasAlbum ||
          (hasNone && isNone))
      ) {
        return false;
      }

    }

  }


  /* カテゴリ */

  if (ignoreProperty !== "categories") {

    const selected =
      getSelected("categories");

    if (
      selected.length > 0 &&
      !selected.some(value =>
        arrayValue(
          music.categories
        ).includes(value)
      )
    ) {
      return false;
    }

  }


  /* ボーカル */

  if (ignoreProperty !== "vocals") {

    const selected =
      getSelected("vocals");

    if (
      selected.length > 0 &&
      !selected.some(value =>
        arrayValue(
          music.vocals
        ).includes(value)
      )
    ) {
      return false;
    }

  }


  /* ガール */

  if (ignoreProperty !== "girls") {

    const selected =
      getSelected("girls");

    if (selected.length > 0) {

      const ids =
        namedIDs(music.girls);

      if (
        !selected.some(id =>
          ids.includes(id)
        )
      ) {
        return false;
      }

    }

  }


  /* キー */

  if (ignoreProperty !== "key") {

    const selected =
      getSelected("key");

    if (
      selected.length > 0 &&
      !selected.some(value =>
        arrayValue(music.key)
          .includes(value)
      )
    ) {
      return false;
    }

  }


  /* 拍子 */

  if (
    ignoreProperty !==
    "timeSignature"
  ) {

    const selected =
      getSelected(
        "timeSignature"
      );

    if (
      selected.length > 0 &&
      !selected.some(value =>
        arrayValue(
          music.timeSignature
        ).includes(value)
      )
    ) {
      return false;
    }

  }


  /* 発売日 */

  if (
    ignoreProperty !==
    "releaseDate"
  ) {

    const date =
      document.getElementById(
        "releaseDateValue"
      ).value;

    if (date) {

      const operator =
        document.getElementById(
          "releaseDateOperator"
        ).value;

      if (
        !compareValue(
          music.releaseDate,
          operator,
          date
        )
      ) {
        return false;
      }

    }

  }


  /* 再生時間 */

  if (
    ignoreProperty !==
    "duration"
  ) {

    const value =
      document.getElementById(
        "durationValue"
      ).value;

    if (value !== "") {

      const operator =
        document.getElementById(
          "durationOperator"
        ).value;

      if (
        !compareValue(
          Number(music.duration),
          operator,
          Number(value)
        )
      ) {
        return false;
      }

    }

  }


  /* BPM */

  if (
    ignoreProperty !==
    "tempo"
  ) {

    const value =
      document.getElementById(
        "tempoValue"
      ).value;

    if (value !== "") {

      const operator =
        document.getElementById(
          "tempoOperator"
        ).value;

      const tempos =
        arrayValue(music.tempo)
          .map(Number);

      if (
        !tempos.some(tempo =>
          compareValue(
            tempo,
            operator,
            Number(value)
          )
        )
      ) {
        return false;
      }

    }

  }


  /* 通常検索 */

  if (
    ignoreProperty !==
    "search"
  ) {

    if (
      currentSearch &&
      !searchMusic(
        music,
        currentSearch
      )
    ) {
      return false;
    }

  }


  return true;
}


/* =========================
   通常検索
========================= */

function searchMusic(
  music,
  query
) {

  const text = [
    music.title,
    music.titleReading,
    music.titleEn,
    ...arrayValue(music.vocals),
    ...arrayValue(music.categories),
    ...namedNames(music.albums),
    ...namedNames(music.girls)
  ]
    .join(" ")
    .toLowerCase();

  return text.includes(
    query.toLowerCase()
  );

}


/* =========================
   検索実行
========================= */

function applySearch() {

  const results =
    musicData.filter(music =>
      matchesFilters(music)
    );

  updateCounts();

  renderResults(results);

}


/* =========================
   件数更新
========================= */

function updateCounts() {

  document
    .querySelectorAll(
      ".filter-option input"
    )
    .forEach(input => {

      const property =
        input.dataset.property;

      const value =
        input.value;

      const count =
        musicData.filter(music => {

          if (
            !matchesFilters(
              music,
              property
            )
          ) {
            return false;
          }

          if (
            property === "albums"
          ) {

            const ids =
              namedIDs(music.albums);

            if (value === "__none__") {
              return ids.length === 0;
            }

            return ids.includes(value);
          }


          if (
            property === "girls"
          ) {

            return namedIDs(
              music.girls
            ).includes(value);

          }


          return arrayValue(
            music[property]
          ).includes(value);

        }).length;


      const countElement =
        document.querySelector(
          `[data-count-for="${CSS.escape(
            property + ":" + value
          )}"]`
        );

      if (countElement) {
        countElement.textContent =
          `(${count})`;
      }

    });

}


/* =========================
   結果表示
========================= */

function renderResults(results) {

  const container =
    document.getElementById(
      "results"
    );

  document.getElementById(
    "resultCount"
  ).textContent =
    results.length;


  if (results.length === 0) {

    container.innerHTML = `
      <div class="empty">
        該当する曲がありません。
      </div>
    `;

    return;
  }


  results =
    sortResults(results);


  container.innerHTML = "";


  results.forEach(music => {

    const card =
      document.createElement("a");

    card.className =
      "music-card";

    card.href =
      `./music/?id=${encodeURIComponent(
        music.id
      )}`;


    const title =
      document.createElement("h3");

    title.textContent =
      music.title;


    card.appendChild(title);


    if (music.titleReading) {

      const reading =
        document.createElement("div");

      reading.className =
        "reading";

      reading.textContent =
        music.titleReading;

      card.appendChild(reading);

    }


    const meta =
      document.createElement("div");

    meta.className =
      "meta";

    const duration =
      formatDuration(
        music.duration
      );

    meta.textContent =
      `${music.releaseDate || ""}` +
      `${duration ? " / " + duration : ""}`;

    card.appendChild(meta);


    const tags =
      document.createElement("div");

    tags.className =
      "tags";


    arrayValue(
      music.categories
    ).forEach(category => {

      const tag =
        document.createElement("span");

      tag.className =
        "tag";

      tag.textContent =
        category;

      tags.appendChild(tag);

    });


    card.appendChild(tags);

    container.appendChild(card);

  });

}


/* =========================
   再生時間表示
========================= */

function formatDuration(
  seconds
) {

  if (
    seconds === null ||
    seconds === undefined
  ) {
    return "";
  }

  const minutes =
    Math.floor(
      seconds / 60
    );

  const sec =
    String(
      seconds % 60
    ).padStart(2, "0");

  return `${minutes}:${sec}`;

}


/* =========================
   並び替え
========================= */

function sortResults(
  results
) {

  const mode =
    document.getElementById(
      "sortSelect"
    ).value;


  const sorted =
    [...results];


  if (mode === "newest") {

    sorted.sort(
      (a, b) =>
        String(b.releaseDate)
          .localeCompare(
            String(a.releaseDate)
          )
    );

  }


  if (mode === "oldest") {

    sorted.sort(
      (a, b) =>
        String(a.releaseDate)
          .localeCompare(
            String(b.releaseDate)
          )
    );

  }


  return sorted;
}


/* =========================
   イベント
========================= */

document.getElementById(
  "searchButton"
).addEventListener(
